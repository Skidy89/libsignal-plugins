syntax = "proto3";

package signal.storage;

message SessionRecord {
    uint32 version = 1;

    Session current = 2;
    repeated Session archived = 3;
}

message Session {
    bytes local_identity_public = 1;
    bytes remote_identity_public = 2;

    uint32 local_registration_id = 3;
    uint32 remote_registration_id = 4;


    bytes root_key = 5;

    uint32 previous_counter = 6;

    SenderChain sender_chain = 7;

    repeated ReceiverChain receiver_chains = 8;


    PendingPreKey pending_pre_key = 9;


    bytes alice_base_key = 10;


    SessionMetadata metadata = 11;
}

message SenderChain {
    bytes ratchet_public = 1;

    bytes ratchet_private = 2;

    ChainKey chain_key = 3;
}

message ReceiverChain {
    bytes ratchet_public = 1;

    ChainKey chain_key = 2;

    repeated MessageKey message_keys = 3;
}

message ChainKey {
    uint32 counter = 1;

    bytes key = 2;
}

message MessageKey {
    uint32 counter = 1;
    

    bytes seed = 2;
}

message PendingPreKey {
    optional uint32 prekey_id = 1;

    uint32 signed_prekey_id = 2;

    bytes base_key = 3;

    uint64 timestamp = 4;
}

message SessionMetadata {
    uint64 created_at = 1;

    uint64 last_used = 2;
}

message PreKeyRecord {
    uint32 id = 1;

    bytes public_key = 2;

    bytes private_key = 3;
}

message SignedPreKeyRecord {
    uint32 id = 1;

    bytes public_key = 2;

    bytes private_key = 3;

    bytes signature = 4;

    uint64 timestamp = 5;
}

message IdentityKeyPair {
    bytes public_key = 1;

    bytes private_key = 2;
}

message SenderKeyState {
    uint32 chain_id = 1;

    SenderChainKey sender_chain_key = 2;

    SenderSigningKey sender_signing_key = 3;

    repeated SenderMessageKey sender_message_keys = 4;

    uint32 message_version = 5;
}

message SenderChainKey {
    uint32 iteration = 1;

    bytes seed = 2;
}

message SenderMessageKey {
    uint32 iteration = 1;

    bytes seed = 2;
}

message SenderSigningKey {
    bytes public_key = 1;

    bytes private_key = 2;
}

message SenderKeyRecord {
    repeated SenderKeyState sender_key_states = 1;
}